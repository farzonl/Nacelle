name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/windows-benchmark.yml"
      - ".github/workflows/offload-compliance.yml"
      - "pages/**"
      - "scripts/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - ".github/workflows/windows-benchmark.yml"
      - ".github/workflows/offload-compliance.yml"
      - "pages/**"
      - "scripts/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      profile_performance:
        description: Run controlled Linux coarse-capture performance acceptance
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test-unix:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            zlib1g-dev \
            libzstd-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            libwayland-dev \
            libegl-dev \
            libxkbcommon-dev \
            libdecor-0-dev \
            libopenblas-dev

      - name: Ensure build tools are installed (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v ninja >/dev/null 2>&1 || brew install ninja
          command -v cmake >/dev/null 2>&1 || brew install cmake

      - name: Checkout core third_party submodules
        run: |
          git submodule update --init --depth 1 \
            third_party/DirectX-Headers \
            third_party/DirectXMath \
            third_party/bcdec \
            third_party/thread-pool \
            third_party/xxHash

      - name: Compute third_party LLVM revision
        id: submodule-rev
        run: |
          LLVM_REV=$(git ls-tree HEAD third_party/llvm-project | awk '{print $3}')
          echo "llvm=${LLVM_REV}" >> "$GITHUB_OUTPUT"

      - name: Restore DXC / GPU SDK cache
        id: cache-sdk
        uses: actions/cache/restore@v4
        with:
          path: .sdk
          key: nacelle-sdk-${{ runner.os }}-${{ runner.arch }}-dxc1.9.2609-vk1.4.357.0

      - name: Install DirectXShaderCompiler (Linux)
        if: runner.os == 'Linux' && steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sdk
          curl -fsSL https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/linux_dxc_2026_09_28.x86_x64.tar.gz \
            | tar -xzf - -C .sdk ./bin ./include ./lib

      - name: Install DirectXShaderCompiler via Vulkan SDK (macOS)
        if: runner.os == 'macOS' && steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sdk/bin .sdk/include .sdk/lib
          VULKAN_VER="1.4.357.0"
          curl -fsSL "https://sdk.lunarg.com/sdk/download/${VULKAN_VER}/mac/vulkansdk-macos-${VULKAN_VER}.zip" -o /tmp/vulkansdk.zip
          unzip -q /tmp/vulkansdk.zip -d /tmp/vulkansdk-installer
          INSTALLER_APP="$(find /tmp/vulkansdk-installer -maxdepth 2 -name '*.app' | head -n 1)"
          INSTALLER_BIN="${INSTALLER_APP}/Contents/MacOS/$(basename "${INSTALLER_APP}" .app)"
          "${INSTALLER_BIN}" --root "/tmp/vulkansdk" --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.core
          cp -a /tmp/vulkansdk/macOS/bin/dxc* .sdk/bin/
          cp -a /tmp/vulkansdk/macOS/include/dxc .sdk/include/
          cp -a /tmp/vulkansdk/macOS/lib/libdxcompiler* .sdk/lib/
          rm -rf /tmp/vulkansdk /tmp/vulkansdk-installer /tmp/vulkansdk.zip

      - name: Save DXC / GPU SDK cache
        if: always() && steps.cache-sdk.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .sdk
          key: nacelle-sdk-${{ runner.os }}-${{ runner.arch }}-dxc1.9.2609-vk1.4.357.0

      - name: Restore third_party LLVM/MLIR binaries cache
        id: cache-llvm
        timeout-minutes: 5
        uses: actions/cache/restore@v4
        with:
          path: .toolchains/llvm
          key: nacelle-llvm-${{ runner.os }}-${{ runner.arch }}-${{ steps.submodule-rev.outputs.llvm }}
          restore-keys: |
            nacelle-llvm-${{ runner.os }}-${{ runner.arch }}-

      - name: Fail if LLVM cache restore timed out
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEY="nacelle-llvm-${{ runner.os }}-${{ runner.arch }}-${{ steps.submodule-rev.outputs.llvm }}"
          COUNT=$(gh api "repos/${{ github.repository }}/actions/caches?key=${KEY}" --jq '.total_count')
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "Error: LLVM cache (${KEY}) exists but restore failed or timed out; aborting instead of rebuilding."
            exit 1
          fi

      - name: Build and install third_party LLVM/MLIR/Clang
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 third_party/llvm-project
          cmake -S third_party/llvm-project/llvm -B build-llvm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/.toolchains/llvm" \
            -DLLVM_ENABLE_PROJECTS="mlir;clang" \
            -DLLVM_TARGETS_TO_BUILD="host" \
            -DLLVM_BUILD_UTILS=ON \
            -DLLVM_INSTALL_UTILS=ON \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DMLIR_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF
          cmake --build build-llvm --parallel
          cmake --install build-llvm
          rm -rf build-llvm

      - name: Save third_party LLVM/MLIR binaries cache
        if: always() && steps.cache-llvm.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .toolchains/llvm
          key: nacelle-llvm-${{ runner.os }}-${{ runner.arch }}-${{ steps.submodule-rev.outputs.llvm }}

      - name: Configure Nacelle
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DNACELLE_ENABLE_INSTRUMENTATION=OFF \
            -DNACELLE_BUILD_PROFILE_TOOLS=OFF \
            -DNACELLE_BUILD_PROFILE_TESTS=OFF \
            -DLLVM_DIR="${{ github.workspace }}/.toolchains/llvm/lib/cmake/llvm" \
            -DMLIR_DIR="${{ github.workspace }}/.toolchains/llvm/lib/cmake/mlir" \
            -DDXC_EXECUTABLE="${{ github.workspace }}/.sdk/bin/dxc" \
            -DFILECHECK_EXECUTABLE="${{ github.workspace }}/.toolchains/llvm/bin/FileCheck" \
            -DSPLIT_FILE_EXECUTABLE="${{ github.workspace }}/.toolchains/llvm/bin/split-file"

      - name: Build Nacelle
        run: cmake --build build --parallel

      - name: Run CTest
        env:
          LD_LIBRARY_PATH: "${{ github.workspace }}/.sdk/lib:${{ github.workspace }}/.toolchains/llvm/lib"
          DYLD_LIBRARY_PATH: "${{ github.workspace }}/.sdk/lib:${{ github.workspace }}/.toolchains/llvm/lib"
        run: ctest --test-dir build --output-on-failure

      - name: Verify instrumentation-OFF isolation
        run: |
          cmake \
            -DBUILD_DIR="${{ github.workspace }}/build" \
            -DLIBRARY_FILE="${{ github.workspace }}/build/libnacelle.a" \
            -DNM_TOOL="${{ github.workspace }}/.toolchains/llvm/bin/llvm-nm" \
            -P cmake/CheckProfileIsolation.cmake

  build-and-test-windows:
    name: Build & Test (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Checkout core third_party submodules
        run: |
          git submodule update --init --depth 1 `
            third_party/DirectX-Headers `
            third_party/DirectXMath `
            third_party/bcdec `
            third_party/thread-pool `
            third_party/xxHash

      - name: Compute third_party LLVM revision
        id: submodule-rev
        run: |
          $llvmRev = ((git ls-tree HEAD third_party/llvm-project) -split '\s+')[2]
          "llvm=$llvmRev" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore DXC SDK cache
        id: cache-sdk
        uses: actions/cache/restore@v4
        with:
          path: .sdk
          key: nacelle-sdk-Windows-x64-dxc1.9.2609-openblas0.3.29

      - name: Install DirectXShaderCompiler & OpenBLAS (Windows)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path .sdk
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip" -OutFile dxc.zip
          Expand-Archive -Path dxc.zip -DestinationPath .sdk -Force
          Remove-Item dxc.zip
          New-Item -ItemType Directory -Force -Path .sdk/openblas
          Invoke-WebRequest -Uri "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.29/OpenBLAS-0.3.29_x64.zip" -OutFile openblas.zip
          Expand-Archive -Path openblas.zip -DestinationPath .sdk/openblas -Force
          Remove-Item openblas.zip

      - name: Save DXC SDK cache
        if: always() && steps.cache-sdk.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .sdk
          key: nacelle-sdk-Windows-x64-dxc1.9.2609-openblas0.3.29

      - name: Restore third_party LLVM/MLIR binaries cache
        id: cache-llvm
        timeout-minutes: 5
        uses: actions/cache/restore@v4
        with:
          path: .toolchains/llvm
          key: nacelle-llvm-Windows-x64-${{ steps.submodule-rev.outputs.llvm }}
          restore-keys: |
            nacelle-llvm-Windows-x64-

      - name: Fail if LLVM cache restore timed out
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $key = "nacelle-llvm-Windows-x64-${{ steps.submodule-rev.outputs.llvm }}"
          $count = [int](gh api "repos/${{ github.repository }}/actions/caches?key=$key" --jq '.total_count')
          if ($LASTEXITCODE -ne 0) { throw "Failed to query GitHub Actions cache API" }
          if ($count -gt 0) {
            throw "LLVM cache ($key) exists but restore failed or timed out; aborting instead of rebuilding."
          }

      - name: Build and install third_party LLVM/MLIR/Clang
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 third_party/llvm-project
          cmake -S third_party/llvm-project/llvm -B build-llvm -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/.toolchains/llvm" `
            -DLLVM_ENABLE_PROJECTS="mlir;clang" `
            -DLLVM_TARGETS_TO_BUILD="host" `
            -DLLVM_BUILD_UTILS=ON `
            -DLLVM_INSTALL_UTILS=ON `
            -DLLVM_ENABLE_ASSERTIONS=OFF `
            -DLLVM_USE_CRT_RELEASE=MD `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DMLIR_INCLUDE_TESTS=OFF `
            -DCLANG_INCLUDE_TESTS=OFF
          cmake --build build-llvm --parallel
          cmake --install build-llvm
          Remove-Item -Recurse -Force build-llvm

      - name: Save third_party LLVM/MLIR binaries cache
        if: always() && steps.cache-llvm.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .toolchains/llvm
          key: nacelle-llvm-Windows-x64-${{ steps.submodule-rev.outputs.llvm }}

      - name: Configure Nacelle
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DNACELLE_ENABLE_INSTRUMENTATION=OFF `
            -DNACELLE_BUILD_PROFILE_TOOLS=OFF `
            -DNACELLE_BUILD_PROFILE_TESTS=OFF `
            -DCMAKE_C_COMPILER="$env:GITHUB_WORKSPACE/.toolchains/llvm/bin/clang-cl.exe" `
            -DCMAKE_CXX_COMPILER="$env:GITHUB_WORKSPACE/.toolchains/llvm/bin/clang-cl.exe" `
            -DCMAKE_C_FLAGS_RELEASE="/clang:-O3 /Ob2 /DNDEBUG" `
            -DCMAKE_CXX_FLAGS_RELEASE="/clang:-O3 /Ob2 /DNDEBUG" `
            -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE/.sdk/openblas" `
            -DLLVM_DIR="$env:GITHUB_WORKSPACE/.toolchains/llvm/lib/cmake/llvm" `
            -DMLIR_DIR="$env:GITHUB_WORKSPACE/.toolchains/llvm/lib/cmake/mlir" `
            -DDXC_EXECUTABLE="$env:GITHUB_WORKSPACE/.sdk/bin/x64/dxc.exe" `
            -DFILECHECK_EXECUTABLE="$env:GITHUB_WORKSPACE/.toolchains/llvm/bin/FileCheck.exe" `
            -DSPLIT_FILE_EXECUTABLE="$env:GITHUB_WORKSPACE/.toolchains/llvm/bin/split-file.exe"

      - name: Build Nacelle
        run: cmake --build build --parallel

      - name: Run CTest
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\.sdk\bin\x64;$env:GITHUB_WORKSPACE\.sdk\openblas\bin;$env:GITHUB_WORKSPACE\.toolchains\llvm\bin;$env:PATH"
          ctest --test-dir build --output-on-failure

      - name: Verify instrumentation-OFF isolation
        run: |
          cmake `
            -DBUILD_DIR="$env:GITHUB_WORKSPACE/build" `
            -DLIBRARY_FILE="$env:GITHUB_WORKSPACE/build/nacelle.lib" `
            -DNM_TOOL="$env:GITHUB_WORKSPACE/.toolchains/llvm/bin/llvm-nm.exe" `
            -P cmake/CheckProfileIsolation.cmake

  build-and-test-profiling:
    name: Build & Test Profiling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sdk-key: dxc1.9.2609-vk1.4.357.0
            exe: ""
            dxc: bin/dxc
          - os: macos-latest
            sdk-key: dxc1.9.2609-vk1.4.357.0
            exe: ""
            dxc: bin/dxc
          - os: windows-latest
            sdk-key: dxc1.9.2609-openblas0.3.29
            exe: ".exe"
            dxc: bin/x64/dxc.exe
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            zlib1g-dev \
            libzstd-dev \
            libopenblas-dev

      - name: Ensure build tools are installed (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v ninja >/dev/null 2>&1 || brew install ninja
          command -v cmake >/dev/null 2>&1 || brew install cmake

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Checkout third_party and profiling submodules
        run: |
          git submodule update --init --depth 1 \
            third_party/DirectX-Headers \
            third_party/DirectXMath \
            third_party/bcdec \
            third_party/thread-pool \
            third_party/xxHash \
            third_party/glaze \
            third_party/zstd \
            third_party/miniz \
            third_party/CLI11

      - name: Compute third_party LLVM revision
        id: submodule-rev
        run: |
          LLVM_REV=$(git ls-tree HEAD third_party/llvm-project | awk '{print $3}')
          echo "llvm=${LLVM_REV}" >> "$GITHUB_OUTPUT"
          echo "LLVM_CACHE_PREFIX=nacelle-llvm-${{ runner.os }}-${{ runner.os == 'Windows' && 'x64' || runner.arch }}" >> "$GITHUB_ENV"

      - name: Restore DXC / GPU SDK cache
        id: cache-sdk
        uses: actions/cache/restore@v4
        with:
          path: .sdk
          key: nacelle-sdk-${{ runner.os }}-${{ runner.os == 'Windows' && 'x64' || runner.arch }}-${{ matrix.sdk-key }}

      - name: Install DirectXShaderCompiler (Linux)
        if: runner.os == 'Linux' && steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sdk
          curl -fsSL https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/linux_dxc_2026_09_28.x86_x64.tar.gz \
            | tar -xzf - -C .sdk ./bin ./include ./lib

      - name: Install DirectXShaderCompiler via Vulkan SDK (macOS)
        if: runner.os == 'macOS' && steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sdk/bin .sdk/include .sdk/lib
          VULKAN_VER="1.4.357.0"
          curl -fsSL "https://sdk.lunarg.com/sdk/download/${VULKAN_VER}/mac/vulkansdk-macos-${VULKAN_VER}.zip" -o /tmp/vulkansdk.zip
          unzip -q /tmp/vulkansdk.zip -d /tmp/vulkansdk-installer
          INSTALLER_APP="$(find /tmp/vulkansdk-installer -maxdepth 2 -name '*.app' | head -n 1)"
          INSTALLER_BIN="${INSTALLER_APP}/Contents/MacOS/$(basename "${INSTALLER_APP}" .app)"
          "${INSTALLER_BIN}" --root "/tmp/vulkansdk" --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.core
          cp -a /tmp/vulkansdk/macOS/bin/dxc* .sdk/bin/
          cp -a /tmp/vulkansdk/macOS/include/dxc .sdk/include/
          cp -a /tmp/vulkansdk/macOS/lib/libdxcompiler* .sdk/lib/
          rm -rf /tmp/vulkansdk /tmp/vulkansdk-installer /tmp/vulkansdk.zip

      - name: Install DirectXShaderCompiler & OpenBLAS (Windows)
        if: runner.os == 'Windows' && steps.cache-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .sdk
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip" -OutFile dxc.zip
          Expand-Archive -Path dxc.zip -DestinationPath .sdk -Force
          Remove-Item dxc.zip
          New-Item -ItemType Directory -Force -Path .sdk/openblas
          Invoke-WebRequest -Uri "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.29/OpenBLAS-0.3.29_x64.zip" -OutFile openblas.zip
          Expand-Archive -Path openblas.zip -DestinationPath .sdk/openblas -Force
          Remove-Item openblas.zip

      - name: Save DXC / GPU SDK cache
        if: always() && steps.cache-sdk.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .sdk
          key: nacelle-sdk-${{ runner.os }}-${{ runner.os == 'Windows' && 'x64' || runner.arch }}-${{ matrix.sdk-key }}

      - name: Restore third_party LLVM/MLIR binaries cache
        id: cache-llvm
        timeout-minutes: 5
        uses: actions/cache/restore@v4
        with:
          path: .toolchains/llvm
          key: ${{ env.LLVM_CACHE_PREFIX }}-${{ steps.submodule-rev.outputs.llvm }}
          restore-keys: |
            ${{ env.LLVM_CACHE_PREFIX }}-

      - name: Fail if LLVM cache restore timed out
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEY="${LLVM_CACHE_PREFIX}-${{ steps.submodule-rev.outputs.llvm }}"
          COUNT=$(gh api "repos/${{ github.repository }}/actions/caches?key=${KEY}" --jq '.total_count')
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "Error: LLVM cache (${KEY}) exists but restore failed or timed out; aborting instead of rebuilding."
            exit 1
          fi

      - name: Build and install third_party LLVM/MLIR/Clang
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 third_party/llvm-project
          args=()
          if [ "$RUNNER_OS" = Windows ]; then
            args+=(-DLLVM_USE_CRT_RELEASE=MD)
          fi
          cmake -S third_party/llvm-project/llvm -B build-llvm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/.toolchains/llvm" \
            -DLLVM_ENABLE_PROJECTS="mlir;clang" \
            -DLLVM_TARGETS_TO_BUILD="host" \
            -DLLVM_BUILD_UTILS=ON \
            -DLLVM_INSTALL_UTILS=ON \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DMLIR_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            "${args[@]}"
          cmake --build build-llvm --parallel
          cmake --install build-llvm
          rm -rf build-llvm

      - name: Save third_party LLVM/MLIR binaries cache
        if: always() && steps.cache-llvm.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .toolchains/llvm
          key: ${{ env.LLVM_CACHE_PREFIX }}-${{ steps.submodule-rev.outputs.llvm }}

      - name: Install primary native debugger
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lldb xvfb
          lldb --version

      - name: Configure instrumented capture tests
        run: |
          echo "Instrumented runner: ${RUNNER_OS}/${RUNNER_ARCH}"
          args=()
          if [ "$RUNNER_OS" = Windows ]; then
            args+=(
              "-DCMAKE_C_COMPILER=$GITHUB_WORKSPACE/.toolchains/llvm/bin/clang-cl.exe"
              "-DCMAKE_CXX_COMPILER=$GITHUB_WORKSPACE/.toolchains/llvm/bin/clang-cl.exe"
              "-DCMAKE_C_FLAGS_RELEASE=/clang:-O3 /Ob2 /DNDEBUG"
              "-DCMAKE_CXX_FLAGS_RELEASE=/clang:-O3 /Ob2 /DNDEBUG"
              "-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/.sdk/openblas"
            )
          fi
          cmake -S . -B build-profile -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNACELLE_FETCH_SDL3=OFF \
            -DNACELLE_ENABLE_INSTRUMENTATION=ON \
            -DNACELLE_ENABLE_CPU_COUNTERS=ON \
            -DNACELLE_BUILD_PROFILE_TOOLS=ON \
            -DNACELLE_BUILD_PROFILE_TESTS=ON \
            -DNACELLE_CLANGXX="${{ github.workspace }}/.toolchains/llvm/bin/clang++${{ matrix.exe }}" \
            -DLLVM_DIR="${{ github.workspace }}/.toolchains/llvm/lib/cmake/llvm" \
            -DMLIR_DIR="${{ github.workspace }}/.toolchains/llvm/lib/cmake/mlir" \
            -DDXC_EXECUTABLE="${{ github.workspace }}/.sdk/${{ matrix.dxc }}" \
            -DFILECHECK_EXECUTABLE="${{ github.workspace }}/.toolchains/llvm/bin/FileCheck${{ matrix.exe }}" \
            -DSPLIT_FILE_EXECUTABLE="${{ github.workspace }}/.toolchains/llvm/bin/split-file${{ matrix.exe }}" \
            "${args[@]}"

      - name: Build instrumented capture tests
        run: |
          cmake --build build-profile --target \
            instrumentation_test profile_memory_test cpu_counter_provider_test cpu_counter_capture_test replay_format_test replay_runtime_static_test replay_runtime_shared_test \
            profile_runtime_static_test profile_runtime_shared_test nacelle-dbg nacelle-replay \
            compute_dispatch_test interlocked_barrier_test \
            rasterizer_pipeline_test graphics_features_test \
            --parallel
          if [ "$RUNNER_OS" = Linux ] || [ "$RUNNER_OS" = Windows ]; then
            cmake --build build-profile --target native_debug_test source_debug_test --parallel
          fi

      - name: Run instrumented capture tests
        env:
          LD_LIBRARY_PATH: "${{ github.workspace }}/build-profile:${{ github.workspace }}/.sdk/lib:${{ github.workspace }}/.toolchains/llvm/lib"
          DYLD_LIBRARY_PATH: "${{ github.workspace }}/build-profile:${{ github.workspace }}/.sdk/lib:${{ github.workspace }}/.toolchains/llvm/lib"
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export PATH="$PWD/build-profile:$PWD/.sdk/bin/x64:$PWD/.sdk/openblas/bin:$PWD/.toolchains/llvm/bin:$PATH"
          fi
          ctest --test-dir build-profile --no-tests=error \
            -R '^(instrumentation_test|cpu_counter_.*test|profile_memory_.*test|profile_overhead_harness_test|native_debug_.*test|source_debug_.*test|replay_format_test|replay_cli_test|replay_runtime_.*_test|profile_runtime_.*_test|spatial_.*_test)$' --output-on-failure

      - name: Verify counter capability OFF preserves ordinary profiling
        run: |
          args=()
          if [ "$RUNNER_OS" = Windows ]; then
            args+=(
              "-DCMAKE_C_COMPILER=$GITHUB_WORKSPACE/.toolchains/llvm/bin/clang-cl.exe"
              "-DCMAKE_CXX_COMPILER=$GITHUB_WORKSPACE/.toolchains/llvm/bin/clang-cl.exe"
            )
          fi
          cmake -S tools/nacelle-dbg -B build-counter-disabled -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DNACELLE_BUILD_PROFILE_TESTS=ON \
            -DNACELLE_ENABLE_CPU_COUNTERS=OFF "${args[@]}"
          cmake --build build-counter-disabled --target instrumentation_test cpu_counter_provider_test --parallel
          ctest --test-dir build-counter-disabled --no-tests=error \
            -R '^(instrumentation_test|cpu_counter_provider_test)$' --output-on-failure

      - name: Set up Node for native profile interoperability
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/nacelle-view/package-lock.json

      - name: Install profile viewer dependencies
        working-directory: tools/nacelle-view
        run: npm ci

      - name: Test native profile interoperability
        working-directory: tools/nacelle-view
        env:
          NACELLE_NATIVE_PROFILE: "${{ github.workspace }}/build-profile/tests/static.nacelle-profile"
          NACELLE_NATIVE_CODE_VERSIONS: "1"
          NACELLE_NATIVE_SHADER_DIR: "${{ github.workspace }}/build-profile/tests/shaders"
          NACELLE_NATIVE_READER: "${{ github.workspace }}/build-profile/tools/nacelle-dbg/nacelle-dbg${{ matrix.exe }}"
          NACELLE_NATIVE_ARTIFACT_PROFILE: "${{ github.workspace }}/build-profile/tests/static-artifacts-source.nacelle-profile"
          NACELLE_NATIVE_SPATIAL_PROFILE: "${{ github.workspace }}/build-profile/tests/static-spatial-dense-simd8.nacelle-profile"
          NACELLE_NATIVE_COUNTER_PROFILE: "${{ github.workspace }}/build-profile/tests/counters-static-tier1.nacelle-profile"
        run: npm test

      - name: Build profile viewer
        working-directory: tools/nacelle-view
        run: npm run build

      - name: Build, test and package optional VS Code integration
        run: |
          npm ci --prefix tools/nacelle-vscode
          npm run build --prefix tools/nacelle-vscode
          npm test --prefix tools/nacelle-vscode
          npm run package --prefix tools/nacelle-vscode

      - name: Test real VS Code editor and shader DAP integration
        if: runner.os == 'Linux'
        env:
          NACELLE_EXTENSION_DEBUG_PROGRAM: "${{ github.workspace }}/build-profile/tests/profile_runtime_static_test"
          NACELLE_EXTENSION_PROFILE_READER: "${{ github.workspace }}/build-profile/tools/nacelle-dbg/nacelle-dbg"
          LD_LIBRARY_PATH: "${{ github.workspace }}/build-profile:${{ github.workspace }}/.sdk/lib:${{ github.workspace }}/.toolchains/llvm/lib"
        run: |
          xvfb-run -a npm run test:smoke --prefix tools/nacelle-vscode
          NACELLE_EXTENSION_SMOKE_UNTRUSTED=1 xvfb-run -a npm run test:smoke --prefix tools/nacelle-vscode

      - name: Verify profile viewer staging
        working-directory: tools/nacelle-view
        run: npm run stage -- ../../build-profile/staged-viewer

      - name: Export native trace for viewer verification
        run: |
          build-profile/tools/nacelle-dbg/nacelle-dbg${{ matrix.exe }} \
            build-profile/tests/static.nacelle-profile \
            --trace build-profile/tests/static-trace.json

      - name: Retain ephemeral native capture fixture for desktop viewer smoke
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-fixture-${{ runner.os }}
          retention-days: 1
          path: |
            build-profile/tests/static.nacelle-profile
            build-profile/tests/static-trace.json

      - name: Install Chromium for offline viewer tests
        if: runner.os == 'Linux'
        working-directory: tools/nacelle-view
        run: npx playwright install --with-deps chromium

      - name: Test offline browser upload, rendering, and downloads
        if: runner.os == 'Linux'
        working-directory: tools/nacelle-view
        env:
          NACELLE_NATIVE_PROFILE: "${{ github.workspace }}/build-profile/tests/static.nacelle-profile"
          NACELLE_NATIVE_TRACE: "${{ github.workspace }}/build-profile/tests/static-trace.json"
        run: npm run test:browser

      - name: Build baseline and current OFF performance controls
        if: runner.os == 'Linux' && inputs.profile_performance
        run: |
          head=$(git rev-parse HEAD)
          git fetch --no-tags --depth=2 origin "$head"
          base=$(git rev-parse "$head^1")
          echo "NACELLE_PERF_BASELINE=$base" >> "$GITHUB_ENV"
          git switch --detach "$base"
          cmake -S . -B build-profile-off -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DNACELLE_FETCH_SDL3=OFF \
            -DNACELLE_ENABLE_INSTRUMENTATION=OFF \
            -DNACELLE_BUILD_PROFILE_TOOLS=OFF \
            -DNACELLE_BUILD_PROFILE_TESTS=OFF \
            -DNACELLE_CLANGXX="$PWD/.toolchains/llvm/bin/clang++" \
            -DLLVM_DIR="$PWD/.toolchains/llvm/lib/cmake/llvm" \
            -DMLIR_DIR="$PWD/.toolchains/llvm/lib/cmake/mlir" \
            -DDXC_EXECUTABLE="$PWD/.sdk/bin/dxc" \
            -DFILECHECK_EXECUTABLE="$PWD/.toolchains/llvm/bin/FileCheck" \
            -DSPLIT_FILE_EXECUTABLE="$PWD/.toolchains/llvm/bin/split-file"
          cmake --build build-profile-off --target bench-worker-nacelle --parallel 2
          cp build-profile-off/bench-worker-nacelle "$RUNNER_TEMP/baseline-off-worker"
          git switch --detach "$head"
          cmake --build build-profile-off --target bench-worker-nacelle --parallel 2
          cmake --build build-profile --target bench-worker-nacelle --parallel 2
          cmake -DBUILD_DIR="$PWD/build-profile-off" \
            -DLIBRARY_FILE="$PWD/build-profile-off/libnacelle.a" \
            -DNM_TOOL="$PWD/.toolchains/llvm/bin/llvm-nm" \
            -P cmake/CheckProfileIsolation.cmake

      - name: Measure coarse capture performance on the dedicated runner
        if: runner.os == 'Linux' && inputs.profile_performance
        timeout-minutes: 45
        run: |
          python3 scripts/measure_profile_overhead.py \
            --off-build build-profile-off --on-build build-profile \
            --baseline-off-worker "$RUNNER_TEMP/baseline-off-worker" \
            --baseline-revision "$NACELLE_PERF_BASELINE" \
            --shader-dir build-profile/tests/shaders \
            --inspector build-profile/tools/nacelle-dbg/nacelle-dbg \
            --output-dir profile-overhead-results --rounds 24 --iters 60 --controlled-host

      - name: Retain coarse performance acceptance evidence
        if: always() && runner.os == 'Linux' && inputs.profile_performance
        uses: actions/upload-artifact@v4
        with:
          name: coarse-profile-performance
          path: |
            profile-overhead-results/identity.json
            profile-overhead-results/runs.jsonl
            profile-overhead-results/summary.json
            profile-overhead-results/*.log
          if-no-files-found: warn

  build-and-test-desktop-viewer:
    name: Build & Test Desktop Viewer (${{ matrix.os }})
    needs: [build-and-test-profiling]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux WebKitGTK and Xvfb packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            pkg-config \
            xvfb

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tools/nacelle-view/package-lock.json
            tools/nacelle-desktop/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache Rust desktop build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/nacelle-desktop/src-tauri

      - name: Download ephemeral native capture fixture
        uses: actions/download-artifact@v4
        with:
          name: desktop-smoke-fixture-${{ runner.os }}
          path: .smoke-fixture

      - name: Install frontend and desktop dependencies
        run: |
          npm ci --prefix tools/nacelle-view
          npm ci --prefix tools/nacelle-desktop

      - name: Build desktop frontend and run policy and Rust tests
        run: |
          npm run build:frontend --prefix tools/nacelle-desktop
          npm test --prefix tools/nacelle-desktop

      - name: Run real native WebView open and export smoke
        env:
          NACELLE_NATIVE_PROFILE: "${{ github.workspace }}/.smoke-fixture/static.nacelle-profile"
          NACELLE_NATIVE_TRACE: "${{ github.workspace }}/.smoke-fixture/static-trace.json"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm run test:smoke --prefix tools/nacelle-desktop
          else
            npm run test:smoke --prefix tools/nacelle-desktop
          fi

      - name: Package production desktop bundle
        run: |
          npm run package --prefix tools/nacelle-desktop
          if [ "$RUNNER_OS" = Linux ]; then
            ls -la tools/nacelle-desktop/src-tauri/target/release/bundle/deb/*.deb
          elif [ "$RUNNER_OS" = macOS ]; then
            ls -ld tools/nacelle-desktop/src-tauri/target/release/bundle/macos/*.app
          else
            ls -la tools/nacelle-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          fi
