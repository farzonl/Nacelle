name: Windows Benchmarks

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: windows-benchmark-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  windows-benchmark:
    name: Benchmark (Nacelle vs WARP vs llvmpipe vs SwiftShader)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Checkout core third_party submodules
        run: |
          git submodule update --init --depth 1 `
            third_party/DirectX-Headers `
            third_party/DirectXMath `
            third_party/bcdec `
            third_party/thread-pool `
            third_party/xxHash

      - name: Compute third_party submodule revisions
        id: submodule-rev
        run: |
          $llvmRev = ((git ls-tree HEAD third_party/llvm-project) -split '\s+')[2]
          $swiftRev = ((git ls-tree HEAD third_party/SwiftShader) -split '\s+')[2]
          "llvm=$llvmRev" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "swiftshader=$swiftRev" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore DXC SDK cache (from CI)
        id: cache-sdk
        uses: actions/cache/restore@v4
        with:
          path: .sdk
          key: nacelle-sdk-Windows-x64-dxc1.9.2609-openblas0.3.29

      - name: Install DirectXShaderCompiler & OpenBLAS (Windows fallback)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path .sdk
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip" -OutFile dxc.zip
          Expand-Archive -Path dxc.zip -DestinationPath .sdk -Force
          Remove-Item dxc.zip
          New-Item -ItemType Directory -Force -Path .sdk/openblas
          Invoke-WebRequest -Uri "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.29/OpenBLAS-0.3.29_x64.zip" -OutFile openblas.zip
          Expand-Archive -Path openblas.zip -DestinationPath .sdk/openblas -Force
          Remove-Item openblas.zip

      - name: Save DXC SDK cache
        if: always() && steps.cache-sdk.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .sdk
          key: nacelle-sdk-Windows-x64-dxc1.9.2609-openblas0.3.29

      - name: Restore third_party LLVM/MLIR binaries cache (from CI)
        id: cache-llvm
        timeout-minutes: 5
        uses: actions/cache/restore@v4
        with:
          path: .toolchains/llvm
          key: nacelle-llvm-Windows-x64-${{ steps.submodule-rev.outputs.llvm }}
          restore-keys: |
            nacelle-llvm-Windows-x64-

      - name: Fail if LLVM cache restore timed out
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $key = "nacelle-llvm-Windows-x64-${{ steps.submodule-rev.outputs.llvm }}"
          $count = [int](gh api "repos/${{ github.repository }}/actions/caches?key=$key" --jq '.total_count')
          if ($LASTEXITCODE -ne 0) { throw "Failed to query GitHub Actions cache API" }
          if ($count -gt 0) {
            throw "LLVM cache ($key) exists but restore failed or timed out; aborting instead of rebuilding."
          }

      - name: Build and install third_party LLVM/MLIR/Clang (fallback)
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 third_party/llvm-project
          cmake -S third_party/llvm-project/llvm -B build-llvm -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/.toolchains/llvm" `
            -DLLVM_ENABLE_PROJECTS="mlir;clang" `
            -DLLVM_TARGETS_TO_BUILD="host" `
            -DLLVM_BUILD_UTILS=ON `
            -DLLVM_INSTALL_UTILS=ON `
            -DLLVM_ENABLE_ASSERTIONS=OFF `
            -DLLVM_USE_CRT_RELEASE=MD `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DMLIR_INCLUDE_TESTS=OFF `
            -DCLANG_INCLUDE_TESTS=OFF
          cmake --build build-llvm --parallel
          cmake --install build-llvm
          Remove-Item -Recurse -Force build-llvm

      - name: Save third_party LLVM/MLIR binaries cache
        if: always() && steps.cache-llvm.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .toolchains/llvm
          key: nacelle-llvm-Windows-x64-${{ steps.submodule-rev.outputs.llvm }}

      - name: Restore SwiftShader cache
        id: cache-swiftshader
        uses: actions/cache/restore@v4
        with:
          path: .toolchains/swiftshader
          key: nacelle-swiftshader-Windows-x64-${{ steps.submodule-rev.outputs.swiftshader }}
          restore-keys: |
            nacelle-swiftshader-Windows-x64-

      - name: Build SwiftShader (Windows)
        id: build-swiftshader
        if: steps.cache-swiftshader.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 third_party/SwiftShader
          cmake -S third_party/SwiftShader -B build-swiftshader -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DSWIFTSHADER_BUILD_TESTS=OFF `
            -DSWIFTSHADER_BUILD_BENCHMARKS=OFF `
            -DSWIFTSHADER_BUILD_SAMPLES=OFF `
            -DSWIFTSHADER_WARNINGS_AS_ERRORS=OFF
          cmake --build build-swiftshader --target vk_swiftshader --parallel
          New-Item -ItemType Directory -Force -Path .toolchains/swiftshader
          Copy-Item build-swiftshader/Windows/* .toolchains/swiftshader/ -Recurse -Force
          if (-not (Test-Path ".toolchains/swiftshader/vk_swiftshader.dll")) {
            $dll = Get-ChildItem -Path build-swiftshader -Recurse -Filter "vk_swiftshader.dll" | Select-Object -First 1
            if (-not $dll) { throw "vk_swiftshader.dll was not produced by SwiftShader build" }
            Copy-Item $dll.FullName .toolchains/swiftshader/ -Force
          }
          @'
          {
            "file_format_version": "1.0.0",
            "ICD": {
              "library_path": ".\\vk_swiftshader.dll",
              "api_version": "1.3.0"
            }
          }
          '@ | Set-Content -Path ".toolchains/swiftshader/vk_swiftshader_icd.json" -Encoding utf8
          Remove-Item -Recurse -Force build-swiftshader

      - name: Save SwiftShader cache
        if: always() && steps.build-swiftshader.outcome == 'success' && steps.cache-swiftshader.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .toolchains/swiftshader
          key: nacelle-swiftshader-Windows-x64-${{ steps.submodule-rev.outputs.swiftshader }}

      - name: Ensure SwiftShader ICD manifest exists
        run: |
          $swiftIcd = Get-ChildItem -Path .toolchains/swiftshader -Recurse -Filter "vk_swiftshader_icd.json" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $swiftIcd) {
            $swiftDll = Get-ChildItem -Path .toolchains/swiftshader -Recurse -Filter "vk_swiftshader.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $swiftDll) { throw "vk_swiftshader.dll not found in .toolchains/swiftshader" }
            $icdPath = Join-Path $swiftDll.DirectoryName "vk_swiftshader_icd.json"
            @{
              file_format_version = "1.0.0"
              ICD = @{
                library_path = ".\vk_swiftshader.dll"
                api_version  = "1.3.0"
              }
            } | ConvertTo-Json | Set-Content -Path $icdPath -Encoding utf8
          }

      - name: Check for preinstalled Lavapipe ICD
        id: check-lavapipe
        run: |
          $icd = ""
          if ($env:LAVAPIPE_ICD_JSON -and (Test-Path $env:LAVAPIPE_ICD_JSON)) {
            $icd = $env:LAVAPIPE_ICD_JSON
          } else {
            $regPath = "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers"
            if (Test-Path $regPath) {
              $props = (Get-Item $regPath).Property |
                Where-Object { $_ -match "lvp_icd" -and $_ -notmatch '\.x86\.json$' -and (Test-Path $_) }
              if ($props) { $icd = $props | Select-Object -First 1 }
            }
          }
          if ($icd) {
            Write-Host "Found preinstalled Lavapipe ICD: $icd"
            "found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "icd=$icd" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Resolve latest Mesa llvmpipe release
        if: steps.check-lavapipe.outputs.found != 'true'
        id: mesa-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ "User-Agent" = "Nacelle-CI" }
          if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest" -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -match "^mesa3d-.*-release-msvc\.7z$" } | Select-Object -First 1
          if (-not $asset) { throw "Could not find release-msvc.7z asset in pal1000/mesa-dist-win latest release ($($rel.tag_name))" }
          "tag=$($rel.tag_name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "url=$($asset.browser_download_url)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore Mesa llvmpipe cache
        if: steps.check-lavapipe.outputs.found != 'true'
        id: cache-llvmpipe
        uses: actions/cache/restore@v4
        with:
          path: .toolchains/llvmpipe
          key: nacelle-llvmpipe-v2-Windows-x64-${{ steps.mesa-release.outputs.tag }}

      - name: Download prebuilt Mesa llvmpipe (Windows)
        id: download-llvmpipe
        if: steps.check-lavapipe.outputs.found != 'true' && steps.cache-llvmpipe.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path .toolchains/llvmpipe
          Invoke-WebRequest -Uri "${{ steps.mesa-release.outputs.url }}" -OutFile mesa.7z
          7z x mesa.7z "-o.toolchains/llvmpipe" -y
          if ($LASTEXITCODE -ne 0) { throw "7z extraction of Mesa llvmpipe failed with exit code $LASTEXITCODE" }
          Remove-Item mesa.7z
          $lvpJson = Get-ChildItem -Path .toolchains/llvmpipe -Recurse -Filter "lvp_icd*.json" |
            Where-Object { $_.FullName -notmatch '[\\/]x86[\\/]' -and $_.Name -notmatch '\.x86\.json$' } |
            Select-Object -First 1
          if (-not $lvpJson) { throw "64-bit lvp_icd*.json not found in extracted Mesa archive" }

      - name: Save Mesa llvmpipe cache
        if: always() && steps.download-llvmpipe.outcome == 'success' && steps.check-lavapipe.outputs.found != 'true' && steps.cache-llvmpipe.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .toolchains/llvmpipe
          key: nacelle-llvmpipe-v2-Windows-x64-${{ steps.mesa-release.outputs.tag }}

      - name: Ensure Vulkan Loader (vulkan-1.dll) is installed
        run: |
          if (-not (Test-Path "$env:SystemRoot\System32\vulkan-1.dll")) {
            Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/VulkanRT-X64-1.4.357.0-Installer.exe" -OutFile VulkanRT.exe
            Start-Process -FilePath .\VulkanRT.exe -ArgumentList "/S" -Wait
            Remove-Item VulkanRT.exe
          }

      - name: Resolve latest Microsoft.Direct3D.WARP NuGet version
        id: warp-release
        run: |
          $idx = Invoke-RestMethod -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/index.json"
          $stable = $idx.versions | Where-Object { $_ -notmatch '-' }
          $ver = if ($stable) { $stable | Select-Object -Last 1 } else { $idx.versions | Select-Object -Last 1 }
          if (-not $ver) { throw "Could not resolve Microsoft.Direct3D.WARP version from NuGet" }
          Write-Host "Resolved Microsoft.Direct3D.WARP version: $ver"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore Microsoft.Direct3D.WARP NuGet cache
        id: cache-warp
        uses: actions/cache/restore@v4
        with:
          path: .toolchains/warp
          key: nacelle-warp-Windows-x64-${{ steps.warp-release.outputs.version }}

      - name: Download Microsoft.Direct3D.WARP from NuGet
        id: download-warp
        if: steps.cache-warp.outputs.cache-hit != 'true'
        run: |
          $ver = "${{ steps.warp-release.outputs.version }}"
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/$ver/microsoft.direct3d.warp.$ver.nupkg"
          Invoke-WebRequest -Uri $url -OutFile warp.zip
          Expand-Archive -Path warp.zip -DestinationPath warp-extract -Force
          Remove-Item warp.zip
          $dlls = Get-ChildItem -Path "warp-extract/build/native" -Recurse -Filter "*.dll" |
            Where-Object { $_.DirectoryName -match '[\\/](x64|amd64)$' }
          if (-not $dlls) { throw "No x64/amd64 WARP DLLs found in Microsoft.Direct3D.WARP $ver" }
          New-Item -ItemType Directory -Force -Path .toolchains/warp | Out-Null
          foreach ($dll in $dlls) {
            Copy-Item $dll.FullName .toolchains/warp/ -Force
          }
          Remove-Item -Recurse -Force warp-extract
          Get-ChildItem .toolchains/warp

      - name: Save Microsoft.Direct3D.WARP NuGet cache
        if: always() && steps.download-warp.outcome == 'success' && steps.cache-warp.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .toolchains/warp
          key: nacelle-warp-Windows-x64-${{ steps.warp-release.outputs.version }}

      - name: Resolve latest Microsoft.Direct3D.D3D12 (Agility SDK) NuGet version
        id: agility-release
        run: |
          $idx = Invoke-RestMethod -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.d3d12/index.json"
          $ver = $idx.versions | Select-Object -Last 1
          if (-not $ver -or $ver -notmatch '^1\.(\d+)(\.|$)') {
            throw "Could not resolve Microsoft.Direct3D.D3D12 version from NuGet: $ver"
          }
          $sdkVer = $Matches[1]
          Write-Host "Resolved Microsoft.Direct3D.D3D12 version: $ver (D3D12SDKVersion=$sdkVer)"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sdk_version=$sdkVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore Microsoft.Direct3D.D3D12 (Agility SDK) NuGet cache
        id: cache-agility
        uses: actions/cache/restore@v4
        with:
          path: .toolchains/agility-sdk
          key: nacelle-agility-Windows-x64-${{ steps.agility-release.outputs.version }}

      - name: Download Microsoft.Direct3D.D3D12 (Agility SDK) from NuGet
        id: download-agility
        if: steps.cache-agility.outputs.cache-hit != 'true'
        run: |
          $ver = "${{ steps.agility-release.outputs.version }}"
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.d3d12/$ver/microsoft.direct3d.d3d12.$ver.nupkg"
          Invoke-WebRequest -Uri $url -OutFile agility.zip
          Expand-Archive -Path agility.zip -DestinationPath agility-extract -Force
          Remove-Item agility.zip
          $binDir = "agility-extract/build/native/bin/x64"
          if (-not (Test-Path "$binDir/D3D12Core.dll")) {
            throw "D3D12Core.dll not found in Microsoft.Direct3D.D3D12 $ver"
          }
          New-Item -ItemType Directory -Force -Path .toolchains/agility-sdk | Out-Null
          Copy-Item "$binDir/D3D12Core.dll" .toolchains/agility-sdk/ -Force
          if (Test-Path "$binDir/d3d12SDKLayers.dll") {
            Copy-Item "$binDir/d3d12SDKLayers.dll" .toolchains/agility-sdk/ -Force
          }
          Remove-Item -Recurse -Force agility-extract
          Get-ChildItem .toolchains/agility-sdk

      - name: Save Microsoft.Direct3D.D3D12 (Agility SDK) NuGet cache
        if: always() && steps.download-agility.outcome == 'success' && steps.cache-agility.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .toolchains/agility-sdk
          key: nacelle-agility-Windows-x64-${{ steps.agility-release.outputs.version }}

      - name: Configure and build nacelle-bench
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$env:GITHUB_WORKSPACE/.toolchains/llvm/bin/clang-cl.exe" `
            -DCMAKE_CXX_COMPILER="$env:GITHUB_WORKSPACE/.toolchains/llvm/bin/clang-cl.exe" `
            -DCMAKE_C_FLAGS_RELEASE="/clang:-O3 /clang:-march=native /Ob2 /DNDEBUG" `
            -DCMAKE_CXX_FLAGS_RELEASE="/clang:-O3 /clang:-march=native /Ob2 /DNDEBUG" `
            -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE/.sdk/openblas" `
            -DNACELLE_D3D12_SDK_VERSION="${{ steps.agility-release.outputs.sdk_version }}" `
            -DLLVM_DIR="$env:GITHUB_WORKSPACE/.toolchains/llvm/lib/cmake/llvm" `
            -DMLIR_DIR="$env:GITHUB_WORKSPACE/.toolchains/llvm/lib/cmake/mlir" `
            -DDXC_EXECUTABLE="$env:GITHUB_WORKSPACE/.sdk/bin/x64/dxc.exe" `
            -DFILECHECK_EXECUTABLE="$env:GITHUB_WORKSPACE/.toolchains/llvm/bin/FileCheck.exe" `
            -DSPLIT_FILE_EXECUTABLE="$env:GITHUB_WORKSPACE/.toolchains/llvm/bin/split-file.exe"
          cmake --build build --target nacelle-bench --parallel

      - name: Run Windows benchmarks (Nacelle vs WARP vs llvmpipe vs SwiftShader)
        run: |
          $lvpIcd = "${{ steps.check-lavapipe.outputs.icd }}"
          if (-not $lvpIcd) {
            $lvpIcd = (Get-ChildItem -Path "$env:GITHUB_WORKSPACE\.toolchains\llvmpipe" -Recurse -Filter "lvp_icd*.json" |
              Where-Object { $_.FullName -notmatch '[\\/]x86[\\/]' -and $_.Name -notmatch '\.x86\.json$' } |
              Select-Object -First 1).FullName
          }
          $swiftIcd = (Get-ChildItem -Path "$env:GITHUB_WORKSPACE\.toolchains\swiftshader" -Recurse -Filter "vk_swiftshader_icd.json" | Select-Object -First 1).FullName
          $icds = @($lvpIcd, $swiftIcd) | Where-Object { $_ }
          Write-Host "Lavapipe ICD: $lvpIcd"
          Write-Host "SwiftShader ICD: $swiftIcd"
          if (-not $icds) { throw "No software Vulkan ICDs found" }
          # GitHub Actions Windows runners execute with elevated (Administrator) privileges,
          # where Khronos vulkan-1.dll ignores VK_ICD_FILENAMES / VK_DRIVER_FILES for security
          # and discovers ICD manifests from HKLM\SOFTWARE\Khronos\Vulkan\Drivers instead.
          $vkRegKey = [Microsoft.Win32.Registry]::LocalMachine.CreateSubKey("SOFTWARE\Khronos\Vulkan\Drivers", $true)
          foreach ($icd in $icds) {
            $vkRegKey.SetValue($icd, 0, [Microsoft.Win32.RegistryValueKind]::DWord)
          }
          $vkRegKey.Close()
          $env:VK_ICD_FILENAMES = ($icds -join ";")
          $env:VK_DRIVER_FILES = $env:VK_ICD_FILENAMES
          $env:VK_LOADER_DEBUG = "error,warn"
          # Place NuGet d3d10warp.dll beside nacelle-bench.exe and Agility SDK DLLs in build\D3D12\
          Copy-Item "$env:GITHUB_WORKSPACE\.toolchains\warp\*.dll" "$env:GITHUB_WORKSPACE\build\" -Force
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\build\D3D12" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\.toolchains\agility-sdk\*.dll" "$env:GITHUB_WORKSPACE\build\D3D12\" -Force
          $env:PATH = "$env:GITHUB_WORKSPACE\.toolchains\warp;$env:GITHUB_WORKSPACE\.sdk\bin\x64;$env:GITHUB_WORKSPACE\.sdk\openblas\bin;$env:GITHUB_WORKSPACE\.toolchains\llvm\bin;$env:PATH;$env:GITHUB_WORKSPACE\.toolchains\llvmpipe\x64;$env:GITHUB_WORKSPACE\.toolchains\swiftshader"
          & "$env:GITHUB_WORKSPACE\build\nacelle-bench.exe" --iters 7 --allow-partial --json "$env:GITHUB_WORKSPACE\bench-results.json"
          if ($LASTEXITCODE -ne 0) { throw "nacelle-bench failed with exit code $LASTEXITCODE" }

      - name: Restore historical benchmark data cache
        uses: actions/cache/restore@v4
        with:
          path: .bench-cache
          key: bench-history-${{ github.event.workflow_run.head_sha || github.sha }}
          restore-keys: |
            bench-history-

      - name: Record benchmark history and build GitHub Pages site
        run: |
          $targetSha = "${{ github.event.workflow_run.head_sha || github.sha }}"
          $msg = git log -1 --pretty=%s
          $author = git log -1 --pretty=%an
          $ts = git log -1 --pretty=%cI
          python scripts/record_bench_history.py `
            --bench-json "$env:GITHUB_WORKSPACE\bench-results.json" `
            --site-src "$env:GITHUB_WORKSPACE\pages" `
            --out-dir "$env:GITHUB_WORKSPACE\_site" `
            --sha "$targetSha" `
            --message "$msg" `
            --author "$author" `
            --timestamp "$ts" `
            --run-url "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" `
            --pages-url "https://$($env:GITHUB_REPOSITORY_OWNER).github.io/$($env:GITHUB_EVENT_REPOSITORY_NAME)" `
            --history-cache "$env:GITHUB_WORKSPACE\.bench-cache\bench-history.json"
        env:
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Save historical benchmark data cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .bench-cache
          key: bench-history-${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Preserve other OS viewer benchmark profiles from live Pages
        env:
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python scripts/preserve_viewer_profiles.py `
            --pages-url "https://$($env:GITHUB_REPOSITORY_OWNER).github.io/$($env:GITHUB_EVENT_REPOSITORY_NAME)" `
            --out-dir "$env:GITHUB_WORKSPACE\bench-profiles" `
            --exclude-platform windows

      - name: Checkout profiling submodules
        run: |
          git submodule update --init --depth 1 `
            third_party/glaze third_party/zstd third_party/miniz third_party/CLI11

      - name: Configure and build instrumented nacelle worker for profile viewer
        run: |
          cmake -S . -B build-profile -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$env:GITHUB_WORKSPACE/.toolchains/llvm/bin/clang-cl.exe" `
            -DCMAKE_CXX_COMPILER="$env:GITHUB_WORKSPACE/.toolchains/llvm/bin/clang-cl.exe" `
            -DCMAKE_C_FLAGS_RELEASE="/clang:-O3 /Ob2 /DNDEBUG" `
            -DCMAKE_CXX_FLAGS_RELEASE="/clang:-O3 /Ob2 /DNDEBUG" `
            -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE/.sdk/openblas" `
            -DNACELLE_FETCH_SDL3=OFF `
            -DNACELLE_ENABLE_INSTRUMENTATION=ON `
            -DNACELLE_CLANGXX="$env:GITHUB_WORKSPACE/.toolchains/llvm/bin/clang++.exe" `
            -DNACELLE_D3D12_SDK_VERSION="${{ steps.agility-release.outputs.sdk_version }}" `
            -DLLVM_DIR="$env:GITHUB_WORKSPACE/.toolchains/llvm/lib/cmake/llvm" `
            -DMLIR_DIR="$env:GITHUB_WORKSPACE/.toolchains/llvm/lib/cmake/mlir" `
            -DDXC_EXECUTABLE="$env:GITHUB_WORKSPACE/.sdk/bin/x64/dxc.exe" `
            -DFILECHECK_EXECUTABLE="$env:GITHUB_WORKSPACE/.toolchains/llvm/bin/FileCheck.exe" `
            -DSPLIT_FILE_EXECUTABLE="$env:GITHUB_WORKSPACE/.toolchains/llvm/bin/split-file.exe"
          cmake --build build-profile --target bench-worker-nacelle --parallel

      - name: Capture benchmark suite profiles for GitHub Pages viewer
        run: |
          $targetSha = "${{ github.event.workflow_run.head_sha || github.sha }}"
          $env:PATH = "$env:GITHUB_WORKSPACE\.sdk\bin\x64;$env:GITHUB_WORKSPACE\.sdk\openblas\bin;$env:GITHUB_WORKSPACE\.toolchains\llvm\bin;$env:PATH"
          python scripts/capture_bench_profiles.py `
            --bench-json "$env:GITHUB_WORKSPACE\bench-results.json" `
            --worker "$env:GITHUB_WORKSPACE\build-profile\bench-worker-nacelle.exe" `
            --shader-dir "$env:GITHUB_WORKSPACE\build\tests\shaders" `
            --out-dir "$env:GITHUB_WORKSPACE\bench-profiles" `
            --sha "$targetSha" `
            --os Windows `
            --platform windows `
            --simd-width 8 `
            --iters 3

      - name: Set up Node for profile viewer
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/nacelle-view/package-lock.json

      - name: Build, test, and stage offline profile viewer
        working-directory: tools/nacelle-view
        env:
          VITE_ENABLE_PRELOADED_PROFILES: "1"
        run: |
          $hasProfiles = Test-Path "..\..\bench-profiles\manifest.json"
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($hasProfiles) {
            npm run stage -- ../../_site --profiles-dir ../../bench-profiles
          } else {
            npm run stage -- ../../_site
          }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
